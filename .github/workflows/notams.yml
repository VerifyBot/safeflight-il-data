name: refresh-notams
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: notams
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch + parse NOTAMs
        run: python3 build-notams.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet notams.json; then
            git config user.name  "safeflight-bot"
            git config user.email "actions@github.com"
            git add notams.json
            git commit -m "chore: refresh NOTAMs ($(date -u +%FT%TZ))"
            git push
          else
            echo "no NOTAM changes"
          fi
